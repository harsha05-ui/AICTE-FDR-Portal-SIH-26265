version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aicte-fdr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aicte_fdr_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d aicte_fdr_db']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aicte-fdr-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/aicte_fdr_db?schema=public
      JWT_SECRET: AICTE_STATUTORY_SECRET_PRODUCTION_KEY_MIN_32_BYTES_STABLE
      JWT_REFRESH_SECRET: AICTE_STATUTORY_REFRESH_SECRET_KEY_MIN_32_BYTES_STABLE
      FILE_ENC_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SESSION_COOKIE_SECRET: AICTE_SESSION_COOKIE_SECRET_KEY_MIN_32_BYTES_PROD
      UPLOAD_DIR: ./uploads
    volumes:
      - backend_uploads:/app/uploads

volumes:
  postgres_data:
  backend_uploads:
