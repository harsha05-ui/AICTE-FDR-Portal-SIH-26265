version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aicte-fdr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aicte_fdr_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d aicte_fdr_db']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aicte-fdr-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: production
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/aicte_fdr_db?schema=public
      JWT_SECRET: aicte_production_jwt_master_secret_key_2026_super_secure
      JWT_REFRESH_SECRET: aicte_production_refresh_secret_key_2026_super_secure
      SESSION_COOKIE_SECRET: aicte_production_session_cookie_secret_2026_super_secure
      FILE_ENC_KEY: 9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c3b2a1f0e9d8c7b6a5f4e3d2c1b0a9f8e
      CORS_ORIGIN: http://localhost:5173
      UPLOAD_DIR: ./uploads
      MAX_FILE_SIZE_MB: 10
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
